name: Reset demo data

# The public demo has no login: every night its database goes back to the fictional seed data.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reset:
    name: Reload demo data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DEMO_DATABASE_URL }}
    steps:
      - name: Skip when the demo database is not configured
        id: configured
        run: echo "ready=${{ env.DATABASE_URL != '' }}" >> "$GITHUB_OUTPUT"

      - if: steps.configured.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: steps.configured.outputs.ready == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - if: steps.configured.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - if: steps.configured.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      - if: steps.configured.outputs.ready == 'true'
        run: pnpm --filter api db:deploy

      - if: steps.configured.outputs.ready == 'true'
        run: pnpm --filter api seed
        env:
          ALLOW_DATA_RESET: "true"
