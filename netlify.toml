# Netlify build of the web app. Set VITE_API_URL (the Render URL of the API) in the site settings.
[build]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm --filter web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "24"

# Client-side routing: every path serves the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
